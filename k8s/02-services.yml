# ── AI Service ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-ai-service
  namespace: crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-ai-service
  template:
    metadata:
      labels:
        app: crm-ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/YOUR_ORG/crm-ai-service:latest
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef: { name: crm-config }
          env:
            - name: GENERATION_MODEL
              value: microsoft/phi-2
            - name: SENTIMENT_MODEL
              value: distilbert-base-uncased-finetuned-sst-2-english
            - name: EMBEDDING_MODEL
              value: sentence-transformers/all-MiniLM-L6-v2
            - name: DEVICE
              value: auto
            - name: HF_CACHE_DIR
              value: /tmp/hf_cache
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8088 }
            initialDelaySeconds: 120
            periodSeconds: 15
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: 2000m, memory: 4Gi }
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf_cache
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: crm-ai-service
  namespace: crm
spec:
  selector:
    app: crm-ai-service
  ports:
    - port: 8088
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache-pvc
  namespace: crm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# ── API Gateway ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api-gateway
  namespace: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-api-gateway
  template:
    metadata:
      labels:
        app: crm-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/YOUR_ORG/crm-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: crm-config }
            - secretRef: { name: crm-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api-gateway
  namespace: crm
spec:
  selector:
    app: crm-api-gateway
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
