---
# ── Auth Service ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-auth-service
  namespace: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-auth-service
  template:
    metadata:
      labels:
        app: crm-auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/YOUR_ORG/crm-auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: crm-config }
            - secretRef: { name: crm-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crm-auth-service
  namespace: crm
spec:
  selector:
    app: crm-auth-service
  ports:
    - port: 8081
---
