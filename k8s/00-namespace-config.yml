apiVersion: v1
kind: Namespace
metadata:
  name: crm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm
data:
  DB_HOST: crm-postgres
  DB_NAME: crm_db
  DB_USER: crm_user
  REDIS_HOST: crm-redis
  KAFKA_BOOTSTRAP: crm-kafka:9092
  ES_HOST: crm-elasticsearch
  CHROMA_HOST: crm-chromadb
  CHROMA_PORT: "8000"
  AUTH_SERVICE_URL: http://crm-auth-service:8081
  USER_SERVICE_URL: http://crm-user-service:8082
  LEAD_SERVICE_URL: http://crm-lead-service:8083
  DEAL_SERVICE_URL: http://crm-deal-service:8084
  EMAIL_SERVICE_URL: http://crm-email-service:8085
  NOTIFICATION_SERVICE_URL: http://crm-notification-service:8086
  ANALYTICS_SERVICE_URL: http://crm-analytics-service:8087
  AI_SERVICE_URL: http://crm-ai-service:8088
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  DB_PASS: crm_pass
  JWT_SECRET: crm-super-secret-key-must-be-at-least-32-chars!!
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USER: noreply@crm.io
  SMTP_PASS: changeme
  TWILIO_ACCOUNT_SID: changeme
  TWILIO_AUTH_TOKEN: changeme
  TWILIO_PHONE_NUMBER: "+10000000000"
