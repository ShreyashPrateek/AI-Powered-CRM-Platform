name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crm

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api-gateway
            context: ./api-gateway
            port: 8080
          - service: auth-service
            context: ./services/auth-service
            port: 8081
          - service: user-service
            context: ./services/user-service
            port: 8082
          - service: lead-service
            context: ./services/lead-service
            port: 8083
          - service: deal-service
            context: ./services/deal-service
            port: 8084
          - service: email-service
            context: ./services/email-service
            port: 8085
          - service: notification-service
            context: ./services/notification-service
            port: 8086
          - service: analytics-service
            context: ./services/analytics-service
            port: 8087
          - service: ai-service
            context: ./services/ai-service
            port: 8088

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags
        run: |
          for svc in api-gateway auth-service user-service lead-service deal-service email-service notification-service analytics-service ai-service; do
            kubectl set image deployment/crm-${svc} ${svc}=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}:${{ github.sha }} -n crm --ignore-not-found
          done

      - name: Wait for rollout
        run: |
          for svc in api-gateway auth-service user-service lead-service deal-service email-service notification-service analytics-service ai-service; do
            kubectl rollout status deployment/crm-${svc} -n crm --timeout=300s --ignore-not-found || true
          done
