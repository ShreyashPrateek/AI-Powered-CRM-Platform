name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Java services ──────────────────────────────────────────────────────────
  java-services:
    name: Build & Test Java Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - services/auth-service
          - services/user-service
          - services/lead-service
          - services/deal-service
          - services/email-service
          - services/notification-service
          - services/analytics-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn -f ${{ matrix.service }}/pom.xml package -DskipTests -q

      - name: Test ${{ matrix.service }}
        run: mvn -f ${{ matrix.service }}/pom.xml test -q

  # ── AI service ─────────────────────────────────────────────────────────────
  ai-service:
    name: Lint AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r services/ai-service/requirements.txt --quiet

      - name: Lint with ruff
        run: |
          pip install ruff --quiet
          ruff check services/ai-service/app

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
